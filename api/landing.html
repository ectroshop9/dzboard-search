<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZBoard - الفحص الذكي</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');

    :root {
      --primary: #3b82f6;
      --secondary: #8b5cf6;
      --success: #10b981;
      --bg: #030712;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* الشبكة الخلفية المضيئة */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
    }

    .glow-blob {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(50px);
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      max-width: 1200px;
      width: 100%;
      z-index: 1;
    }

    /* 3D Canvas - Right */
    #canvas-container {
      width: 600px;
      height: 500px;
      flex-shrink: 0;
      position: relative;
    }

    /* Upload - Left */
    .upload-section {
      flex: 1;
      max-width: 450px;
      position: relative;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .title {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 15px;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title span {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    .upload-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .upload-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
      transform: translateX(-100%);
      transition: 0.5s;
    }

    .upload-card:hover {
      transform: translateY(-5px);
      border-color: rgba(59, 130, 246, 0.4);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(59, 130, 246, 0.15);
    }

    .upload-card:hover::before {
      transform: translateX(100%);
      transition: 1s infinite;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      transition: 0.3s;
    }

    .upload-card:hover .icon-wrapper {
      transform: scale(1.1);
      background: rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }

    .upload-text { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .upload-hint { font-size: 13px; color: #64748b; }

    #result-container {
      display: none;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 30px;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .loading-state { text-align: center; }
    .loading-spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(59, 130, 246, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    .result-success { text-align: center; }
    .result-icon {
      width: 60px; height: 60px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin: 0 auto 15px;
    }
    .result-name { font-size: 20px; font-weight: 800; margin-bottom: 5px; color: #fff; }
    .result-desc { font-size: 14px; color: #94a3b8; margin-bottom: 25px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff; text-decoration: none;
      padding: 14px 28px; border-radius: 12px;
      font-weight: 800; font-size: 15px;
      transition: all 0.3s; width: 100%;
      border: none; cursor: pointer;
    }
    .btn:hover { box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.1); margin-top: 10px; color: #94a3b8; }
    .btn-outline:hover { background: rgba(255,255,255,0.05); color: #fff; box-shadow: none;}

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      .container { flex-direction: column-reverse; gap: 30px; text-align: center; }
      #canvas-container { width: 100%; height: 350px; }
      .upload-section { width: 100%; max-width: 100%; }
      .title { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="glow-blob"></div>
  
  <div class="container">
    <!-- Upload Section -->
    <div class="upload-section">
      <div id="main-ui">
        <span class="badge">نظام البحث المرئي</span>
        <h1 class="title">التعرف الذكي على<br><span>شاشات التلفاز</span></h1>
        <p class="subtitle">قم برفع صورة واضحة للتلفاز أو شاشة العرض، وسيقوم النظام بمطابقتها مع قاعدة بيانات الأجهزة فوراً.</p>

        <div class="upload-card" onclick="document.getElementById('fileInput').click()">
          <div class="icon-wrapper">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #60a5fa;">
              <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
              <polyline points="17 2 12 7 7 2"></polyline>
            </svg>
          </div>
          <div class="upload-text">اضغط هنا لرفع صورة الشاشة</div>
          <div class="upload-hint">يدعم JPG, PNG (حد أقصى 5MB)</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
      </div>

      <!-- Result Section -->
      <div id="result-container"></div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>
  </div>

  <script>
    // ==========================================
    // 3D EXPERIANCE - 3D REALISTIC SMART TV
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
    
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const tvGroup = new THREE.Group();
    scene.add(tvGroup);

    // مقاسات التلفاز (شاشة سينمائية عريضة 16:9)
    const tvWidth = 4.2;
    const tvHeight = 2.3;
    const tvThickness = 0.08;

    // 1. الإطار الخارجي والخلفية (بلاستيك غير لامع)
    const frameGeo = new THREE.BoxGeometry(tvWidth, tvHeight, tvThickness);
    const frameMat = new THREE.MeshPhysicalMaterial({ 
      color: 0x111111, roughness: 0.8, metalness: 0.2
    });
    const frame = new THREE.Mesh(frameGeo, frameMat);
    tvGroup.add(frame);

    // 2. إنشاء نسيج (Texture) حيوي للشاشة باستخدام Canvas
    const screenCanvas = document.createElement('canvas');
    screenCanvas.width = 1024;
    screenCanvas.height = 512;
    const ctx = screenCanvas.getContext('2d');
    const screenTexture = new THREE.CanvasTexture(screenCanvas);
    screenTexture.minFilter = THREE.LinearFilter;

    // 3. شاشة العرض (زجاج لامع ومضيء)
    const screenGeo = new THREE.PlaneGeometry(tvWidth - 0.08, tvHeight - 0.08);
    const screenMat = new THREE.MeshPhysicalMaterial({
      map: screenTexture,
      emissive: 0xffffff,
      emissiveMap: screenTexture,
      emissiveIntensity: 1.2, // قوة سطوع الشاشة
      roughness: 0.05, // زجاج أملس جداً يعكس الضوء
      metalness: 0.1,
      clearcoat: 1.0, 
      clearcoatRoughness: 0.05
    });
    const screenMesh = new THREE.Mesh(screenGeo, screenMat);
    screenMesh.position.z = (tvThickness / 2) + 0.005; // أمام الإطار مباشرة
    tvGroup.add(screenMesh);

    // 4. حامل التلفاز (Stand - ألمنيوم مصقول)
    const metalMat = new THREE.MeshStandardMaterial({ 
      color: 0xcccccc, metalness: 1.0, roughness: 0.3 
    });
    
    // رقبة الحامل
    const neckGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.4, 16);
    const neck = new THREE.Mesh(neckGeo, metalMat);
    neck.position.y = -(tvHeight / 2) - 0.2;
    tvGroup.add(neck);

    // قاعدة الحامل
    const baseGeo = new THREE.BoxGeometry(1.4, 0.05, 0.7);
    const base = new THREE.Mesh(baseGeo, metalMat);
    base.position.y = -(tvHeight / 2) - 0.4;
    tvGroup.add(base);

    // إضاءة المشهد (لعكس لمعان الزجاج والمعدن)
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    // إضاءة زرقاء خفيفة خلف التلفاز (Ambilight)
    const backLight = new THREE.PointLight(0x3b82f6, 1.5, 6);
    backLight.position.set(0, 0, -2);
    tvGroup.add(backLight);

    camera.position.set(0, 0, 5.5);
    camera.lookAt(0, 0, 0);

    // تفاعل التلفاز مع الماوس
    let mouseX = 0; let mouseY = 0;
    let targetX = 0; let targetY = 0;
    document.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX - window.innerWidth / 2) * 0.001;
      mouseY = (event.clientY - window.innerHeight / 2) * 0.001;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // تحريك التلفاز (المنظور)
      targetX = mouseX;
      targetY = mouseY;
      tvGroup.rotation.y += 0.05 * (targetX - tvGroup.rotation.y);
      tvGroup.rotation.x += 0.05 * (targetY - tvGroup.rotation.x);
      
      // حركة طفو خفيفة
      tvGroup.position.y = Math.sin(time) * 0.05;

      // تحديث محتوى الشاشة (رسم رادار وشبكة مسح ذكية)
      drawScreen(time);

      renderer.render(scene, camera);
    }

    function drawScreen(time) {
      // تنظيف الشاشة ورسم خلفية زرقاء داكنة
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#040b16');
      grad.addColorStop(1, '#0b1d3a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);

      // رسم شبكة (Grid)
      ctx.strokeStyle = 'rgba(59, 130, 246, 0.2)';
      ctx.lineWidth = 1;
      for(let i=0; i<1024; i+=40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      }
      for(let i=0; i<512; i+=40) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
      }

      // خط مسح متحرك (Scanner)
      const scanY = (time * 150) % 512;
      ctx.fillStyle = 'rgba(96, 165, 250, 0.4)';
      ctx.fillRect(0, scanY, 1024, 10);
      
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#60a5fa';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 50px Cairo, sans-serif';
      ctx.textAlign = 'center';
      
      // تأثير النبض في النص
      ctx.globalAlpha = 0.5 + Math.abs(Math.sin(time * 2)) * 0.5;
      ctx.fillText('AI VISION SYSTEM', 512, 256);
      
      ctx.font = '24px Cairo, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('WAITING FOR INPUT...', 512, 300);
      
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur = 0;

      // إخبار Three.js بتحديث نسيج الشاشة
      screenTexture.needsUpdate = true;
    }

    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      const width = container.clientWidth;
      const height = container.clientHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    });

    // ==========================================
    // LOGIC - IMAGE UPLOAD & API
    // ==========================================
    const fileInput = document.getElementById('fileInput');
    const mainUI = document.getElementById('main-ui');
    const resultContainer = document.getElementById('result-container');

    function showLoading() {
      mainUI.style.display = 'none';
      resultContainer.style.display = 'block';
      resultContainer.innerHTML = `
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <h3 style="font-weight: 800; font-size: 20px; margin-bottom: 5px;">جاري فحص الشاشة...</h3>
          <p style="color: #94a3b8; font-size: 14px;">يتم الآن مطابقة المعالم في قاعدة البيانات</p>
        </div>
      `;
    }

    function showResult(success, data) {
      if (success) {
        resultContainer.innerHTML = `
          <div class="result-success">
            <div class="result-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h3 class="result-name">تم التعرف بنجاح!</h3>
            <p class="result-desc">الشاشة: <strong style="color:#fff">${data.product.name}</strong></p>
            <a href="${data.product_url || '#'}" target="_blank" class="btn">عرض تفاصيل المنتج</a>
            <button onclick="resetUI()" class="btn btn-outline">فحص شاشة أخرى</button>
          </div>
        `;
      } else {
        resultContainer.innerHTML = `
          <div class="result-success">
            <div class="result-icon" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <h3 class="result-name">لم يتم العثور على تطابق</h3>
            <p class="result-desc">تأكد من وضوح صورة الشاشة والمحاولة مجدداً.</p>
            <button onclick="resetUI()" class="btn">حاول بصورة أوضح</button>
          </div>
        `;
      }
    }

    window.resetUI = function() {
      resultContainer.style.display = 'none';
      mainUI.style.display = 'block';
      fileInput.value = '';
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      showLoading();

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file', blob, 'card.jpg');

            try {
              const res = await fetch('/search-by-image', { method: 'POST', body: formData });
              const data = await res.json();
              
              if (data.success && data.product) {
                showResult(true, data);
              } else {
                showResult(false);
              }
            } catch (err) {
              console.error(err);
              showResult(false);
            }
          }, 'image/jpeg', 0.8);
        };
      };
    });
  </script>
</body>
</html>
