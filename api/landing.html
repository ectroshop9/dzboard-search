<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZBoard - افحص كرتك</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background: #0a0a1a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .logo {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 900;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-shadow: 0 0 40px rgba(59, 130, 246, 0.5);
    }

    .subtitle {
      font-size: clamp(14px, 3vw, 18px);
      color: #94a3b8;
      margin-bottom: 30px;
      max-width: 500px;
      line-height: 1.6;
    }

    .upload-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      transition: all 0.3s;
    }

    .upload-card:hover {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
    }

    .upload-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 30px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      transition: all 0.3s;
    }

    .upload-btn:hover {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }

    .upload-icon {
      font-size: 48px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .upload-text {
      font-size: 16px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .upload-hint {
      font-size: 12px;
      color: #64748b;
    }

    #result {
      margin-top: 20px;
      display: none;
      padding: 20px;
      border-radius: 16px;
    }

    .success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .loading {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .product-link {
      display: inline-block;
      margin-top: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 800;
      transition: all 0.3s;
    }

    .product-link:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
    }

    .features {
      display: flex;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 12px;
      color: #94a3b8;
      backdrop-filter: blur(10px);
    }

    .feature span {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="content">
    <div class="logo">DZBoard</div>
    <p class="subtitle">افحص كرتك الإلكتروني بالذكاء الاصطناعي - ارفع صورة وسنجد لك القطعة فوراً</p>

    <div class="upload-card">
      <div class="upload-btn" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📸</div>
        <div class="upload-text">اضغط لرفع صورة الكرت</div>
        <div class="upload-hint">يدعم الصور من الكاميرا أو المعرض</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
      
      <div id="result"></div>
    </div>

    <div class="features">
      <div class="feature"><span>🔍</span>دقة عالية</div>
      <div class="feature"><span>⚡</span>نتيجة فورية</div>
      <div class="feature"><span>📦</span>+90 قطعة</div>
    </div>
  </div>

  <script>
    // ============ 3D Background ============
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Circuit Board 3D
    const boardGeometry = new THREE.BoxGeometry(4, 0.2, 4);
    const boardMaterial = new THREE.MeshPhongMaterial({
      color: 0x1a472a,
      shininess: 100,
      specular: 0x333333
    });
    const board = new THREE.Mesh(boardGeometry, boardMaterial);
    scene.add(board);

    // Components
    const componentPositions = [
      [-1, 0.15, -1], [1, 0.15, 0.5], [0.5, 0.15, -1.5], [-1.5, 0.15, 1],
      [0, 0.2, 0], [1.5, 0.2, -0.5], [-0.5, 0.2, 1.5]
    ];

    componentPositions.forEach((pos, i) => {
      const chipGeometry = new THREE.BoxGeometry(0.6, 0.2, 0.6);
      const chipMaterial = new THREE.MeshPhongMaterial({
        color: i % 2 === 0 ? 0x1e1e1e : 0x333333,
        shininess: 80
      });
      const chip = new THREE.Mesh(chipGeometry, chipMaterial);
      chip.position.set(pos[0], pos[1], pos[2]);
      board.add(chip);
    });

    // Traces (lines on board)
    for (let i = 0; i < 15; i++) {
      const traceGeometry = new THREE.BoxGeometry(0.05, 0.01, Math.random() * 1.5 + 0.5);
      const traceMaterial = new THREE.MeshPhongMaterial({ color: 0xd4a017 });
      const trace = new THREE.Mesh(traceGeometry, traceMaterial);
      trace.position.set(
        Math.random() * 3 - 1.5,
        0.11,
        Math.random() * 3 - 1.5
      );
      trace.rotation.y = Math.random() * Math.PI;
      board.add(trace);
    }

    // Lights
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const blueLight = new THREE.PointLight(0x3b82f6, 1, 20);
    blueLight.position.set(-3, 2, -3);
    scene.add(blueLight);

    const purpleLight = new THREE.PointLight(0x8b5cf6, 1, 20);
    purpleLight.position.set(3, 2, 3);
    scene.add(purpleLight);

    camera.position.z = 6;
    camera.position.y = 1;

    // Animation
    function animate() {
      requestAnimationFrame(animate);
      board.rotation.y += 0.003;
      board.rotation.x = Math.sin(Date.now() * 0.0003) * 0.1;
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============ Image Search ============
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.className = 'loading';
      resultDiv.innerHTML = '<p style="color:#93c5fd">🔄 جاري الفحص...</p>';

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file', blob, 'card.jpg');

            try {
              const res = await fetch('/search-by-image', {
                method: 'POST',
                body: formData
              });
              const data = await res.json();

              if (data.success && data.product?.name) {
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                  <p style="font-size:18px;font-weight:900;color:#6ee7b7;margin-bottom:8px;">✅ ${data.product.name}</p>
                  <a href="${data.product_url}" target="_blank" class="product-link">🔗 عرض المنتج في المتجر</a>
                `;
              } else {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '<p style="color:#fca5a5">❌ لم يتم العثور على تطابق</p>';
              }
            } catch (err) {
              resultDiv.className = 'error';
              resultDiv.innerHTML = '<p style="color:#fca5a5">❌ حدث خطأ</p>';
            }
          }, 'image/jpeg', 0.7);
        };
      };
    });
  </script>
</body>
</html>
