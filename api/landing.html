<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZBoard - افحص كرتك بالذكاء الاصطناعي</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      background: #050510;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============ Header ============ */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 5, 16, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      font-size: 13px;
      color: #94a3b8;
    }

    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover { color: #fff; }

    /* ============ Hero ============ */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      padding: 100px 40px 40px;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* 3D Canvas - يمين */
    .canvas-wrapper {
      flex: 1;
      max-width: 500px;
      height: 500px;
      position: relative;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(59,130,246,0.05), transparent);
    }

    /* Upload Section - يسار */
    .upload-section {
      flex: 1;
      max-width: 450px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 11px;
      color: #60a5fa;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    .title {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 15px;
    }

    .title span {
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .upload-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      transition: all 0.3s;
    }

    .upload-card:hover {
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 10px 40px rgba(59, 130, 246, 0.1);
    }

    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      cursor: pointer;
      padding: 25px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      transition: all 0.3s;
      background: rgba(0, 0, 0, 0.2);
    }

    .upload-btn:hover {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.05);
    }

    .upload-icon {
      font-size: 36px;
      animation: float 3s ease-in-out infinite;
    }

    .upload-info {
      text-align: right;
    }

    .upload-text {
      font-size: 15px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .upload-hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }

    #result {
      margin-top: 15px;
      display: none;
      padding: 18px;
      border-radius: 14px;
      animation: fadeIn 0.5s ease;
    }

    .success { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); }
    .error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); }
    .loading { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.25); }

    .result-name {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .product-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      padding: 12px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.3s;
    }

    .product-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
    }

    .spinner {
      width: 25px;
      height: 25px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }

    /* ============ Features ============ */
    .features {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 14px;
    }

    .feature span { font-size: 16px; }

    /* ============ Animations ============ */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ Mobile ============ */
    @media (max-width: 968px) {
      .hero {
        flex-direction: column-reverse;
        padding: 80px 20px 30px;
        gap: 30px;
      }

      .canvas-wrapper {
        max-width: 350px;
        height: 300px;
        order: -1;
      }

      .header {
        padding: 15px 20px;
      }

      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">DZBoard</div>
    <nav class="nav-links">
      <a href="#">الرئيسية</a>
      <a href="#">المتجر</a>
      <a href="#">من نحن</a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <!-- Upload - Left -->
    <div class="upload-section">
      <div class="badge">
        <span class="badge-dot"></span>
        ذكاء اصطناعي للتعرف على القطع
      </div>
      <h1 class="title">افحص <span>كرتك الإلكتروني</span> في ثوانٍ</h1>
      <p class="subtitle">ارفع صورة الكرت وسيتعرف النظام على الموديل فوراً ويعرضه لك في المتجر</p>

      <div class="upload-card">
        <div class="upload-btn" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">📸</div>
          <div class="upload-info">
            <div class="upload-text">ارفع صورة الكرت</div>
            <div class="upload-hint">من الكاميرا أو المعرض</div>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
        
        <div id="result"></div>
      </div>

      <div class="features">
        <div class="feature"><span>🎯</span> دقة 99%</div>
        <div class="feature"><span>⚡</span> نتيجة فورية</div>
        <div class="feature"><span>📦</span> +90 قطعة</div>
      </div>
    </div>

    <!-- 3D Canvas - Right -->
    <div class="canvas-wrapper">
      <div id="canvas-container"></div>
    </div>
  </section>

  <script>
    // ============ 3D Circuit Board ============
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Board
    const boardGeo = new THREE.BoxGeometry(3, 0.12, 3);
    const boardMat = new THREE.MeshStandardMaterial({ color: 0x0d2818, roughness: 0.5, metalness: 0.4 });
    const board = new THREE.Mesh(boardGeo, boardMat);
    scene.add(board);

    // CPU
    const cpuGeo = new THREE.BoxGeometry(1, 0.2, 1);
    const cpuMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.2, metalness: 0.8 });
    const cpu = new THREE.Mesh(cpuGeo, cpuMat);
    cpu.position.y = 0.15;
    board.add(cpu);

    // Small chips
    for (let i = 0; i < 8; i++) {
      const chipGeo = new THREE.BoxGeometry(0.5, 0.12, 0.5);
      const chipMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.3, metalness: 0.6 });
      const chip = new THREE.Mesh(chipGeo, chipMat);
      chip.position.set(Math.random() * 2.2 - 1.1, 0.12, Math.random() * 2.2 - 1.1);
      board.add(chip);
    }

    // Capacitors
    for (let i = 0; i < 10; i++) {
      const capGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.35, 12);
      const capMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.5 });
      const cap = new THREE.Mesh(capGeo, capMat);
      cap.position.set(Math.random() * 2.4 - 1.2, 0.25, Math.random() * 2.4 - 1.2);
      board.add(cap);
    }

    // Gold traces
    for (let i = 0; i < 20; i++) {
      const traceGeo = new THREE.BoxGeometry(0.04, 0.008, Math.random() * 1.5 + 0.4);
      const traceMat = new THREE.MeshStandardMaterial({ color: 0xd4a017, roughness: 0.2, metalness: 0.9, emissive: 0x3a2a00, emissiveIntensity: 0.4 });
      const trace = new THREE.Mesh(traceGeo, traceMat);
      trace.position.set(Math.random() * 2.6 - 1.3, 0.07, Math.random() * 2.6 - 1.3);
      trace.rotation.y = Math.random() * Math.PI;
      board.add(trace);
    }

    // Lights
    const ambient = new THREE.AmbientLight(0x1a1a2e, 0.6);
    scene.add(ambient);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(4, 6, 4);
    scene.add(mainLight);

    const blueLight = new THREE.PointLight(0x3b82f6, 1.5, 10);
    blueLight.position.set(-3, 2, -2);
    scene.add(blueLight);

    const purpleLight = new THREE.PointLight(0x8b5cf6, 1.5, 10);
    purpleLight.position.set(3, 2, 2);
    scene.add(purpleLight);

    camera.position.set(0, 0.5, 5.5);
    camera.lookAt(0, 0, 0);

    // Animation
    function animate3D() {
      requestAnimationFrame(animate3D);
      board.rotation.y += 0.006;
      blueLight.intensity = 1.5 + Math.sin(Date.now() * 0.002) * 0.4;
      purpleLight.intensity = 1.5 + Math.cos(Date.now() * 0.002) * 0.4;
      renderer.render(scene, camera);
    }
    animate3D();

    // Resize
    function resizeCanvas() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
    window.addEventListener('resize', resizeCanvas);

    // ============ Image Search ============
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.className = 'loading';
      resultDiv.innerHTML = '<div class="spinner"></div><p style="color:#93c5fd;font-weight:700;text-align:center">جاري الفحص...</p>';

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file', blob, 'card.jpg');

            try {
              const res = await fetch('/search-by-image', { method: 'POST', body: formData });
              const data = await res.json();

              if (data.success && data.product?.name) {
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                  <p class="result-name" style="color:#6ee7b7">✅ ${data.product.name}</p>
                  <a href="${data.product_url}" target="_blank" class="product-link">🔗 عرض في المتجر</a>
                `;
              } else {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '<p style="color:#fca5a5;font-weight:700;text-align:center">❌ لم يتم العثور على تطابق</p>';
              }
            } catch (err) {
              resultDiv.className = 'error';
              resultDiv.innerHTML = '<p style="color:#fca5a5;font-weight:700;text-align:center">❌ حدث خطأ</p>';
            }
          }, 'image/jpeg', 0.7);
        };
      };
    });
  </script>
</body>
</html>
